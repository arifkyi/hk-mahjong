<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="author" content="Ahmad Rifky Idrus">
<meta name="description" content="Hong Kong Mahjong: a single-file, offline game. No network access of any kind.">
<title>Hong Kong Mahjong 香港麻雀</title>
<style>
:root{
  --felt1:#3aa860; --felt2:#1e7a42; --felt3:#0f5229;
  --frame:#3d2418; --frame2:#5a3826;
  --ivory:#faf6e8; --ivory2:#ece4cd; --tile-edge:#cfc5a8; --side2:#cdb87c;
  --back1:#2b8076; --back2:#14514a;
  --red:#b3372c; --blue:#1d4f8f; --green:#1e6b34; --ink:#22201c;
  --gold:#d8b25a;
}
*{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:#10160f;
  font-family:-apple-system,"Helvetica Neue","PingFang HK","PingFang SC",sans-serif;
  color:#e9e4d6; overflow:hidden;
}
#app{height:100vh;display:flex;flex-direction:column;}

/* ---------- top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:12px;padding:8px 16px;
  background:linear-gradient(#241a12,#1a120c);border-bottom:2px solid var(--frame2);
  flex:0 0 auto;
}
#topbar h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px;color:var(--gold);}
#topbar h1 span{color:#cfc6b0;font-weight:400;font-size:13px;margin-left:8px;}
#topbar .spacer{flex:1;}
#topbar .minfan{font-size:12px;color:#cfc6b0;display:flex;align-items:center;gap:6px;}
#topbar .mark{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:12.5px;color:var(--gold);opacity:.85;margin-left:10px;white-space:nowrap;}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0 4px;}
.namegrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#cfc6b0;}
.namegrid label span{color:var(--gold);font-weight:700;}
.namegrid input{
  background:#2b2117;border:1px solid #6b5133;color:#f2e9d4;border-radius:7px;
  padding:7px 9px;font-size:14px;font-family:inherit;
}
.namegrid input:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
#panel a{color:var(--gold);}
@media (max-width:820px){ #topbar .mark{display:none;} }
#topbar select{background:#3a2c1e;border:1px solid #6b5133;color:#eadfc6;border-radius:6px;padding:3px 6px;font-size:13px;}
#topbar select:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.btn{
  background:#3a2c1e;border:1px solid #6b5133;color:#eadfc6;border-radius:6px;
  padding:5px 12px;font-size:13px;cursor:pointer;
}
.btn:hover{background:#4a3826;}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ---------- table ---------- */
#table{
  flex:1;position:relative;min-height:0;
  background:radial-gradient(ellipse at 50% 34%, var(--felt1) 0%, var(--felt2) 58%, var(--felt3) 100%);
  border-top:8px solid var(--frame);
  box-shadow:inset 0 0 90px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;
  padding:8px 10px 0;overflow:hidden;
}
#boardwrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;}
#table:not(.view3d) #board{transform:scale(var(--bs,1));}
#board{
  display:grid;
  grid-template-columns:26px 100px 1fr 100px 26px;
  grid-template-rows:26px minmax(70px,auto) minmax(120px,1fr) 26px;
  grid-template-areas:
    "wt wt   wt   wt    wt"
    "wl top  top  top   wr"
    "wl left cent right wr"
    "wb wb   wb   wb    wb";
  gap:6px;
  transform-origin:50% 100%;
  transition:transform .45s ease;
}
#table.view3d #board{transform:perspective(1050px) rotateX(35deg) scale(var(--bs,1));}

/* ---------- the wall ---------- */
.wall{display:flex;gap:2px;align-items:center;justify-content:center;overflow:hidden;}
.wall.h{flex-direction:row;}
.wall.v{flex-direction:column;}
#w-top{grid-area:wt;} #w-bottom{grid-area:wb;}
#w-left{grid-area:wl;} #w-right{grid-area:wr;}
.wtile{
  background:linear-gradient(180deg,#f4e8c0,#d3bd85);
  border:1px solid #b9a268;border-radius:2px;
  box-shadow:0 1px 2px rgba(0,0,0,.35);flex:0 0 auto;
}
.wall.h .wtile{flex:1 1 0;min-width:0;height:22px;}
.wall.v .wtile{flex:1 1 0;min-height:0;width:22px;}
.wtile.gone{opacity:.13;box-shadow:none;}

/* ---------- seats ---------- */
.seat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:0;}
#seat-top{grid-area:top;}
#seat-left{grid-area:left;}
#seat-right{grid-area:right;}

.pname{
  font-size:12px;color:#f4efdd;background:rgba(0,0,0,.4);
  padding:3px 10px;border-radius:12px;display:flex;gap:8px;align-items:center;white-space:nowrap;
}
.pname .wind{color:var(--gold);font-weight:700;}
.pname .seatno{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:16px;height:16px;padding:0 3px;margin-left:-4px;
  border:1px solid var(--gold);border-radius:8px;
  font-size:10px;font-weight:700;color:var(--gold);line-height:1;
}
#hub .pwlab{font-size:9.5px;color:#cfe0cf;letter-spacing:.3px;}
.pname .score{color:#bfe3c8;}
.pname.turn{box-shadow:0 0 0 2px var(--gold);}

.handrow{display:flex;gap:2px;align-items:flex-end;flex-wrap:nowrap;}
.handcol{display:flex;flex-direction:column;align-items:center;}
.handcol .tile{margin-bottom:-5px;}
.handcol .tile:last-child{margin-bottom:0;}
.handrow .tile.back-h{margin-right:-4px;}
.handrow .tile.back-h:last-child{margin-right:0;}
.meldrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:100%;}
.meld{display:flex;gap:1px;background:rgba(0,0,0,.2);padding:2px;border-radius:4px;}
.flowerrow{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;}

/* ---------- tiles ---------- */
.tile{
  position:relative;
  background:linear-gradient(180deg,#fffaf0 0%,var(--ivory) 55%,var(--ivory2) 100%);
  border-radius:9%/7%;
  box-shadow:0 2px 0 #d3c59f, 0 5px 0 var(--side2), 0 7px 10px rgba(0,0,0,.42);
  flex:0 0 auto;display:block;
}
.tile svg{position:absolute;inset:6% 7%;width:86%;height:88%;display:block;}
.tz{font-family:"Noto Serif TC","Songti TC","Songti SC","SimSun","PingFang HK","Hiragino Mincho ProN","Heiti SC",serif;font-weight:900;}

/* sizes: every face keeps the 3:4 ratio of the artwork */
.t-xl{--w:min(72px, calc((100vw - 110px)/14)); width:var(--w); height:calc(var(--w)*4/3);}
.t-lg{width:54px;height:72px;}
.t-md{width:45px;height:60px;}
.t-sm{width:34px;height:45px;}
.t-xs{width:28px;height:37px;box-shadow:0 1px 0 #d3c59f, 0 3px 0 var(--side2), 0 4px 6px rgba(0,0,0,.4);}

.tile.back{
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 3px, transparent 3px 6px),
    linear-gradient(160deg,var(--back1),var(--back2));
  box-shadow:0 2px 0 #0b2e2a, 0 4px 7px rgba(0,0,0,.45);
  border-radius:4px;
}
.tile.back-h{width:22px;height:33px;}
.tile.back-v{width:33px;height:22px;}

#myhand .tile{cursor:pointer;transition:transform .1s ease;}
#myhand .tile:hover{transform:translateY(-10px);}
#myhand .tile.nohover{cursor:default;}
#myhand .tile.nohover:hover{transform:none;}
#myhand .tile.drawn{margin-left:28px;}
#myhand .tile.drawn::before{
  content:"";position:absolute;left:-17px;top:16%;bottom:16%;
  width:2px;border-radius:1px;background:rgba(216,178,90,.8);
}
.tile.hot{outline:2px solid var(--gold);outline-offset:1px;}
#myhand .tile.use{outline:3px solid var(--gold);outline-offset:1px;transform:translateY(-12px);}
.abtn .btiles .tile.from-table{outline:2px solid var(--gold);outline-offset:1px;}
.abtn .btiles .tile.from-table::after{
  content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:5px solid var(--gold);
}
.abtn .useinfo{display:block;font-size:10px;color:#f3d9a8;margin-top:9px;letter-spacing:.2px;}

/* ---------- centre ---------- */
#center{
  grid-area:cent;display:grid;min-width:0;min-height:0;
  grid-template-columns:1fr minmax(104px,124px) 1fr;
  grid-template-rows:1fr minmax(76px,92px) 1fr;
  grid-template-areas:
    "dleft dtop   dtop"
    "dleft hub    dright"
    "dbot  dbot   dright";
  gap:3px;padding:3px;
}
.dzone{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;min-width:0;min-height:0;overflow:hidden;}
#d-top{grid-area:dtop;justify-content:flex-end;align-content:flex-start;}
#d-bottom{grid-area:dbot;justify-content:flex-start;align-content:flex-end;}
#d-left{grid-area:dleft;justify-content:flex-start;align-content:flex-start;}
#d-right{grid-area:dright;justify-content:flex-end;align-content:flex-end;}
#hub{
  grid-area:hub;background:rgba(0,0,0,.35);border:1px solid rgba(216,178,90,.55);
  border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:6px;text-align:center;
}
#hub .pw{
  width:36px;height:36px;border-radius:6px;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;
  font-family:"PingFang HK",sans-serif;box-shadow:inset 0 0 6px rgba(0,0,0,.4);
}
#hub .wall{font-size:11px;color:#e6e0cc;display:block;}
#hub .handno{font-size:10px;color:#a9c3ad;}

/* ---------- action bar & my zone ---------- */
#actionbar{
  flex:0 0 auto;height:138px;width:100%;position:relative;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding-bottom:6px;
}
#status{
  background:rgba(0,0,0,.5);padding:5px 18px;border-radius:16px;
  font-size:14px;color:#f7f2e0;white-space:nowrap;pointer-events:none;max-width:96%;overflow:hidden;text-overflow:ellipsis;
}
#actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:0;}
.abtn{
  background:linear-gradient(#8a2f24,#6e241b);border:1px solid #d8b25a;color:#ffe9c2;
  font-size:15px;font-weight:700;padding:7px 14px;border-radius:9px;cursor:pointer;
  box-shadow:0 3px 7px rgba(0,0,0,.45);text-align:center;
}
.abtn small{display:block;font-size:10px;font-weight:400;color:#f3d9a8;}
.abtn .btiles{display:flex;gap:2px;justify-content:center;margin-top:5px;}
.abtn:hover{background:linear-gradient(#a0392b,#7e2a20);}
.abtn.pass{background:linear-gradient(#3d4a42,#2a342e);border-color:#7b8a80;color:#dfe8e0;}
.abtn:focus-visible{outline:2px solid #fff;outline-offset:2px;}

#myzone{
  flex:0 0 auto;width:100%;position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:5px;padding-bottom:8px;
}
#mystrip{display:flex;gap:16px;align-items:flex-end;justify-content:center;flex-wrap:wrap;min-height:0;}

/* ---------- overlay ---------- */
#overlay{
  position:fixed;inset:0;background:rgba(8,14,8,.8);display:none;
  align-items:center;justify-content:center;z-index:20;
}
#overlay.show{display:flex;}
#panel{
  background:linear-gradient(#2b2117,#1d1610);border:2px solid var(--gold);
  border-radius:14px;padding:26px 32px;max-width:660px;width:min(92vw,660px);
  max-height:86vh;overflow:auto;box-shadow:0 10px 50px rgba(0,0,0,.6);
}
#panel h2{margin:0 0 6px;color:var(--gold);font-size:22px;}
#panel h3{margin:14px 0 6px;color:#e8d9b0;font-size:14px;}
#panel .fanline{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px dashed rgba(216,178,90,.25);}
#panel .total{font-size:16px;font-weight:700;color:var(--gold);margin-top:8px;display:flex;justify-content:space-between;}
#panel .tilespread{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0;}
#panel p{font-size:13.5px;line-height:1.55;color:#ddd4c0;}
#panel p.small{font-size:12.5px;color:#bfb6a2;}
#panel .btnrow{margin-top:18px;display:flex;gap:10px;justify-content:flex-end;}
#panel table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
#panel td,#panel th{padding:4px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);}
#panel td.num{text-align:right;font-weight:700;color:var(--gold);white-space:nowrap;}
#panel .pos{color:#9fd8a8;} #panel .neg{color:#e08b7f;}

@media (max-width:900px){
  #board{grid-template-columns:20px 80px 1fr 80px 20px;grid-template-rows:20px minmax(58px,auto) minmax(100px,1fr) 20px;}
}
@media (max-height:820px){
  .t-xl{--w:min(60px, calc((100vw - 110px)/14));}
  #actionbar{height:126px;}
  #myzone{gap:3px;padding-bottom:5px;}
}
@media (max-height:700px){
  .t-xl{--w:min(50px, calc((100vw - 110px)/14));}
  .t-md{width:36px;height:48px;}
  .t-sm{width:29px;height:39px;}
  #actionbar{height:112px;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>香港麻雀 <span>Hong Kong Mahjong</span></h1>
    <span class="mark">rifky the lifestyle</span>
    <div class="spacer"></div>
    <label class="minfan"><span id="minfan-lab">Min faan</span> <select id="minfan"><option value="0">0</option><option value="1">1</option><option value="3" selected>3</option></select></label>
    <select id="lang" aria-label="Language"><option value="en">EN</option><option value="id">ID</option></select>
    <button class="btn" id="btn-view">Top view</button>
    <button class="btn" id="btn-names">Players</button>
    <button class="btn" id="btn-rules">Rules</button>
    <button class="btn" id="btn-about">About</button>
    <button class="btn" id="btn-new">New game</button>
  </div>

  <div id="table" class="view3d">
    <div id="boardwrap">
      <div id="board">
        <div class="wall h" id="w-top"></div>
        <div class="wall v" id="w-left"></div>
        <div class="wall v" id="w-right"></div>
        <div class="wall h" id="w-bottom"></div>

        <div class="seat" id="seat-top">
          <div class="pname" id="pn2"></div>
          <div class="handrow" id="hand2"></div>
          <div class="meldrow" id="melds2"></div>
          <div class="flowerrow" id="fl2"></div>
        </div>
        <div class="seat" id="seat-left">
          <div class="pname" id="pn3"></div>
          <div class="handcol" id="hand3"></div>
          <div class="meldrow" id="melds3"></div>
          <div class="flowerrow" id="fl3"></div>
        </div>
        <div class="seat" id="seat-right">
          <div class="pname" id="pn1"></div>
          <div class="handcol" id="hand1"></div>
          <div class="meldrow" id="melds1"></div>
          <div class="flowerrow" id="fl1"></div>
        </div>

        <div id="center">
          <div class="dzone" id="d-top"></div>
          <div class="dzone" id="d-left"></div>
          <div id="hub">
            <div class="pwlab" id="pwlab">Round wind 圈風</div>
            <div class="pw" id="pwind">東</div>
            <div class="wall" id="wallinfo"></div>
            <div class="handno" id="handinfo"></div>
          </div>
          <div class="dzone" id="d-right"></div>
          <div class="dzone" id="d-bottom"></div>
        </div>
      </div>
    </div>

    <div id="actionbar">
      <div id="status"></div>
      <div id="actions"></div>
    </div>

    <div id="myzone">
      <div id="mystrip">
        <div class="meldrow" id="melds0"></div>
        <div class="flowerrow" id="fl0"></div>
      </div>
      <div class="handrow" id="myhand"></div>
      <div class="pname" id="pn0"></div>
    </div>
  </div>
</div>

<div id="overlay"><div id="panel"></div></div>

<script>
"use strict";
/* ================= tiles =================
   0-8   萬 1-9 (characters)
   9-17  筒 1-9 (dots)
   18-26 條 1-9 (bamboo)
   27-30 winds 東南西北
   31-33 dragons 中發白
   34-41 flowers 梅蘭菊竹 / seasons 春夏秋冬
*/
const CN_NUM=["一","二","三","四","五","六","七","八","九"];
const WINDS=["東","南","西","北"];
const DRAGONS=["中","發","白"];
const FLOWERS=["梅","蘭","菊","竹","春","夏","秋","冬"];
const WIND_EN=["East","South","West","North"];
const DEFAULT_NAMES=["You 你","Ah Bo 阿寶","Mei Ling 美玲","Uncle Chan 陳叔"];
const NAMES=DEFAULT_NAMES.slice();
function loadNames(){
  try{
    const raw=localStorage.getItem("hkmj.names");
    if(raw){const a=JSON.parse(raw);
      if(Array.isArray(a))for(let i=0;i<4;i++)if(typeof a[i]==="string"&&a[i].trim())NAMES[i]=a[i].trim().slice(0,22);}
  }catch(e){}
}
function saveNames(){ try{localStorage.setItem("hkmj.names",JSON.stringify(NAMES));}catch(e){} }
function defaultName(i){ return i===0?T("you"):DEFAULT_NAMES[i]; }

const suitOf=t=> t<9?0 : t<18?1 : t<27?2 : t<31?3 : t<34?4 : 5;
const numOf =t=> t%9;
const isFlower=t=> t>=34;
const isHonor =t=> t>=27 && t<34;

function tileName(t){
  if(t<9)  return CN_NUM[t]+"萬";
  if(t<18) return CN_NUM[t-9]+"筒";
  if(t<27) return CN_NUM[t-18]+"條";
  if(t<31) return WINDS[t-27];
  if(t<34) return DRAGONS[t-31];
  return FLOWERS[t-34];
}

/* ================= language ================= */
let LANG="en";
try{const v=localStorage.getItem("hkmj.lang"); if(v==="id"||v==="en")LANG=v;}catch(e){}
const LI=()=>LANG==="id"?1:0;

// faan names: [English, Indonesia] with the 漢字 kept in both
const FN={
  chicken:["雞糊 Chicken hand","雞糊 Tangan Ayam"],
  allchows:["平糊 All chows","平糊 Semua Chow"],
  allpungs:["對對糊 All pungs","對對糊 Pung Semua"],
  half:["混一色 Mixed one suit","混一色 Half Flush"],
  full:["清一色 Pure one suit","清一色 Full Flush"],
  mixorph:["花幺九 Mixed orphans","花幺九 Mixed Orphans"],
  seven:["七對子 Seven pairs","七對子 Seven Pairs"],
  smalld:["小三元 Small dragons","小三元 Tiga Naga Kecil"],
  bigd:["大三元 Great dragons","大三元 Tiga Naga Besar"],
  smallw:["小四喜 Small winds","小四喜 Empat Angin Kecil"],
  bigw:["大四喜 Great winds","大四喜 Empat Angin Besar"],
  allhon:["字一色 All honours","字一色 Semua Kehormatan"],
  allterm:["清么九 All terminals","清么九 Semua 1 & 9"],
  gates:["九子連環 Nine gates","九子連環 Sembilan Gerbang"],
  fourconc:["坎坎糊 Four concealed pungs","坎坎糊 Empat Pung Tertutup"],
  fourkong:["十八羅漢 Four kongs","十八羅漢 Empat Kong"],
  orphans:["十三么 Thirteen orphans","十三么 13 Yatim"],
  heaven:["天糊 Heavenly hand","天糊 Tangan Langit"],
  earth:["地糊 Earthly hand","地糊 Tangan Bumi"],
  eightfl:["八仙過海 All eight flowers","八仙過海 Delapan Bunga"],
  noflower:["無花 No flowers","無花 Tanpa Bunga"],
  seatflower:["正花 Seat flower","正花 Bunga Kursi"],
  flowerset:["一台花 Complete flowers 梅蘭菊竹","一台花 Set Bunga Lengkap 梅蘭菊竹"],
  seasonset:["一台花 Complete seasons 春夏秋冬","一台花 Set Musim Lengkap 春夏秋冬"],
  dragon:["役牌 Dragon pung","役牌 Set Naga"],
  seatwind:["門風 Seat wind","門風 Angin Kursi"],
  roundwind:["圈風 Prevailing wind","圈風 Angin Ronde"],
  zimo:["自摸 Self-draw","自摸 Ambil Sendiri"],
  concealed:["門前清 Concealed hand","門前清 Tangan Tertutup"],
  kongrep:["槓上開花 Win on replacement tile","槓上開花 Pengganti Kong"],
  robkong:["搶槓 Robbing the kong","搶槓 Rebut Kong"],
  last:["海底撈月 Win by last catch","海底撈月 Tile Terakhir"]
};
const fn=k=>FN[k][LI()];

// interface strings, {0} {1} are filled in order
const L={

/* ================= hand evaluation ================= */
function countsOf(arr){const c=new Array(34).fill(0);for(const t of arr)c[t]++;return c;}

// enumerate all standard decompositions (pair + melds) of concealed counts
function decompose(counts){
  const res=[]; const c=counts.slice();
  for(let p=0;p<34;p++){
    if(c[p]>=2){
      c[p]-=2;
      rec(0,[]);
      c[p]+=2;
    }
    function rec(i,melds){
      while(i<34&&c[i]===0)i++;
      if(i>=34){res.push({pair:p,melds:melds.slice()});return;}
      if(c[i]>=3){c[i]-=3;melds.push({t:"pung",tile:i});rec(i,melds);melds.pop();c[i]+=3;}
      if(i<27&&(i%9)<=6&&c[i+1]>0&&c[i+2]>0){
        c[i]--;c[i+1]--;c[i+2]--;melds.push({t:"chow",tile:i});rec(i,melds);melds.pop();
        c[i]++;c[i+1]++;c[i+2]++;
      }
    }
  }
  return res;
}

const ORPHANS=[0,8,9,17,18,26,27,28,29,30,31,32,33];
function isThirteenOrphans(counts){
  let pair=false;
  let total=0; for(let i=0;i<34;i++)total+=counts[i];
  if(total!==14)return false;
  for(const t of ORPHANS){
    if(counts[t]===0)return false;
    if(counts[t]===2)pair=true;
    if(counts[t]>2)return false;
  }
  for(let i=0;i<34;i++)if(counts[i]>0&&!ORPHANS.includes(i))return false;
  return pair;
}

function canWin(counts,meldCount){
  if(meldCount===0&&isThirteenOrphans(counts))return true;
  if(meldCount===0&&isSevenPairs(counts))return true;
  return decompose(counts).length>0;
}

// standard-hand shanten (0 = tenpai/waiting, -1 = winning)
function shanten(counts,fixedMelds){
  const c=counts.slice(); let best=8;
  function evaluate(melds,partials,hasPair){
    const m=melds+fixedMelds;
    let p=partials;
    if(m+p>4)p=4-m;
    if(p<0)p=0;
    const st=8-2*m-p-(hasPair?1:0);
    if(st<best)best=st;
  }
  function rec(i,melds,partials,hasPair){
    if(best<=-1)return;
    while(i<34&&c[i]===0)i++;
    if(i>=34){evaluate(melds,partials,hasPair);return;}
    const n=c[i];
    if(n>=3){c[i]-=3;rec(i,melds+1,partials,hasPair);c[i]+=3;}
    if(i<27&&(i%9)<=6&&c[i+1]>0&&c[i+2]>0){
      c[i]--;c[i+1]--;c[i+2]--;rec(i,melds+1,partials,hasPair);c[i]++;c[i+1]++;c[i+2]++;
    }
    if(n>=2){
      if(!hasPair){c[i]-=2;rec(i,melds,partials,true);c[i]+=2;}
      c[i]-=2;rec(i,melds,partials+1,hasPair);c[i]+=2;
    }
    if(i<27&&(i%9)<=7&&c[i+1]>0){c[i]--;c[i+1]--;rec(i,melds,partials+1,hasPair);c[i]++;c[i+1]++;}
    if(i<27&&(i%9)<=6&&c[i+2]>0){c[i]--;c[i+2]--;rec(i,melds,partials+1,hasPair);c[i]++;c[i+2]++;}
    c[i]--;rec(i,melds,partials,hasPair);c[i]++;
  }
  rec(0,0,0,false);
  return best;
}

/* ================= faan scoring (Hong Kong standard) ================= */
let MIN_FAN=3;
const CAP_FAN=13;
const DEAD_WALL=14;
const isTermOrHonor=t=> t>=27 || t%9===0 || t%9===8;

function isSevenPairs(counts){
  let pairs=0;
  for(let i=0;i<34;i++){
    if(counts[i]===0)continue;
    if(counts[i]!==2)return false;
    pairs++;
  }
  return pairs===7;
}
function isNineGates(counts){
  let total=0;for(let i=0;i<34;i++)total+=counts[i];
  if(total!==14)return false;
  for(let s=0;s<3;s++){
    const b=s*9;let n=0;for(let k=0;k<9;k++)n+=counts[b+k];
    if(n!==14)continue;
    if(counts[b]<3||counts[b+8]<3)return false;
    for(let k=1;k<8;k++)if(counts[b+k]<1)return false;
    return true;
  }
  return false;
}

// ctx: {discarder, robKong}
function calcFan(G,pi,winTile,selfDraw,ctx){
  ctx=ctx||{};
  const P=G.players[pi];
  const seat=(pi-G.dealer+4)%4;
  const conc=P.hand.slice();conc.push(winTile);
  const counts=countsOf(conc);
  const allT=conc.slice();for(const m of P.melds)for(const t of m.tiles)allT.push(t);
  const concealedHand=P.melds.every(m=>m.type==="ckong");

  /* ---- bonus points ---- */
  const extra=[];
  const fl=P.flowers;
  const fSet=[34,35,36,37].every(f=>fl.includes(f));
  const sSet=[38,39,40,41].every(f=>fl.includes(f));
  if(fl.length===0)extra.push([fn("noflower"),1]);
  else{
    let seatN=0;
    for(const f of fl){
      if(f<38&&fSet)continue;
      if(f>=38&&sSet)continue;
      if((f-34)%4===seat)seatN++;
    }
    if(seatN)extra.push([fn("seatflower")+(seatN>1?" ×"+seatN:""),seatN]);
    if(fSet)extra.push([fn("flowerset"),2]);
    if(sSet)extra.push([fn("seasonset"),2]);
  }
  if(selfDraw)extra.push([fn("zimo"),1]);
  if(concealedHand)extra.push([fn("concealed"),1]);
  const di=G.drawInfo||{};
  if(selfDraw&&(di.kong||di.flower))extra.push([fn("kongrep"),1]);
  if(ctx.robKong)extra.push([fn("robkong"),1]);
  const lastTile=selfDraw?!!di.last:(!ctx.robKong&&liveLeft()===0);
  if(lastTile)extra.push([fn("last"),1]);

  const cands=[];
  const addStacked=pat=>{const lines=pat.concat(extra);cands.push({pat,lines,total:Math.min(CAP_FAN,lines.reduce((a,x)=>a+x[1],0))});};
  const addLimit=(name,v)=>cands.push({limit:true,pat:[[name,v]],lines:[[name,v]],total:v});

  const suits=new Set();let honors=false;
  for(const t of allT){if(t<27)suits.add(suitOf(t));else honors=true;}
  const flushPat=()=>suits.size===1?(honors?[[fn("half"),3]]:[[fn("full"),7]]):[];
  const allTermHon=allT.every(isTermOrHonor);

  /* ---- limit hands 例牌: no wind, dragon or flower bonus ---- */
  if(fl.length===8)addLimit(fn("eightfl"),13);
  if(suits.size===0)addLimit(fn("allhon"),10);
  else if(allTermHon&&!honors)addLimit(fn("allterm"),10);
  const noMelds=P.melds.length===0;
  if(noMelds&&isNineGates(counts))addLimit(fn("gates"),10);
  if(noMelds&&isThirteenOrphans(counts))addLimit(fn("orphans"),13);
  const kongs=P.melds.filter(m=>m.type==="kong"||m.type==="ckong").length;
  if(kongs===4)addLimit(fn("fourkong"),13);
  const firstGo=!G.anyClaim;
  if(firstGo&&selfDraw&&pi===G.dealer&&G.discardsMade===0)addLimit(fn("heaven"),13);
  if(firstGo&&pi!==G.dealer&&(
      (selfDraw&&P.discards.length===0)||
      (!selfDraw&&ctx.discarder===G.dealer&&G.discardsMade===1)))
    addLimit(fn("earth"),13);

  /* ---- seven pairs (variant) ---- */
  if(noMelds&&isSevenPairs(counts))addStacked([[fn("seven"),4]].concat(flushPat()));

  /* ---- standard 4 sets + 1 pair ---- */
  for(const d of decompose(counts)){
    const sets=[];
    for(const m of P.melds)sets.push({t:m.type==="chow"?"chow":"pung",tile:m.tiles[0]});
    for(const m of d.melds)sets.push(m);
    const pat=[];
    const allPung=sets.every(s=>s.t==="pung");
    if(allPung&&concealedHand){addLimit(fn("fourconc"),10);}
    if(allPung)pat.push([fn("allpungs"),3]);
    else if(sets.every(s=>s.t==="chow"))pat.push([fn("allchows"),1]);
    pat.push(...flushPat());
    if(allTermHon&&honors&&suits.size>0)pat.push([fn("mixorph"),1]);
    let dP=0;for(const s of sets)if(s.t==="pung"&&s.tile>=31)dP++;
    if(dP>0)pat.push([fn("dragon")+(dP>1?" ×"+dP:""),dP]);
    const dPair=d.pair>=31;
    if(dP===3)pat.push([fn("bigd"),5]);
    else if(dP===2&&dPair)pat.push([fn("smalld"),3]);
    let wP=0;for(const s of sets)if(s.t==="pung"&&s.tile>=27&&s.tile<31)wP++;
    const wPair=d.pair>=27&&d.pair<31;
    if(wP===4)addLimit(fn("bigw"),13);
    for(const s of sets){
      if(s.t!=="pung")continue;
      if(s.tile===27+seat)pat.push([fn("seatwind")+" "+WINDS[seat],1]);
      if(s.tile===27+G.prevailing)pat.push([fn("roundwind")+" "+WINDS[G.prevailing],1]);
    }
    if(wP===3&&wPair)pat.push([fn("smallw"),6]);
    addStacked(pat);
  }

  let best=null;for(const c of cands)if(!best||c.total>best.total)best=c;
  if(!best)best={pat:[],lines:extra.slice(),total:Math.min(CAP_FAN,extra.reduce((a,x)=>a+x[1],0))};
  const lines=best.lines.slice();
  if(!best.limit&&best.pat.length===0)lines.unshift([fn("chicken"),0]);
  return {fans:lines,fan:best.total};
}

/* ================= game state ================= */
const G={
  players:[],wall:[],dealer:0,prevailing:0,cur:0,lastDiscard:null,drawnIdx:-1,canDiscard:false,
  scores:[0,0,0,0],handNum:1,started:false,busy:false,drawInfo:null,anyClaim:false,discardsMade:0
};

function newPlayers(){
  G.players=[0,1,2,3].map(i=>({hand:[],melds:[],flowers:[],discards:[]}));
}
function buildWall(){
  const w=[];
  for(let t=0;t<34;t++)for(let k=0;k<4;k++)w.push(t);
  for(let t=34;t<42;t++)w.push(t);
  for(let i=w.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[w[i],w[j]]=[w[j],w[i]];}
  G.wall=w;
}
// the last 14 tiles are the dead wall and are never drawn in normal play
function liveLeft(){return Math.max(0,G.wall.length-DEAD_WALL);}
function drawFront(){return G.wall.length>DEAD_WALL?G.wall.shift():null;}
function drawBack(){return G.wall.length?G.wall.pop():null;}

function sortHand(p){G.players[p].hand.sort((a,b)=>a-b);}
// your own hand: sort it, but keep a freshly drawn tile on its own at the right end
function sortMyHand(){
  const P=G.players[0];
  if(G.drawnIdx===P.hand.length-1&&P.hand.length>1){
    const last=P.hand.pop();
    P.hand.sort((a,b)=>a-b);
    P.hand.push(last);
    G.drawnIdx=P.hand.length-1;
  }else{
    P.hand.sort((a,b)=>a-b);
    G.drawnIdx=-1;
  }
}

function drawFor(p,fromBack){
  const kong=!!fromBack;let flower=false;
  let t=fromBack?drawBack():drawFront();
  while(t!==null&&isFlower(t)){G.players[p].flowers.push(t);flower=true;t=drawBack();}
  G.drawInfo={p,kong,flower,last:!kong&&liveLeft()===0};
  return t;
}

/* ================= rendering ================= */
const $=id=>document.getElementById(id);
// the four wall strips around the board, shrinking as tiles are drawn
const WALL_CAP={h:34,v:18};
function renderWall(){
  const f=Math.max(0,Math.min(1,liveLeft()/130));
  const put=(id,kind)=>{
    const el=$(id); if(!el)return;
    const cap=WALL_CAP[kind];
    if(el.childElementCount!==cap){
      el.innerHTML="";
      for(let i=0;i<cap;i++){const d=document.createElement("div");d.className="wtile";el.appendChild(d);}
    }
    const keep=Math.round(cap*f);
    for(let i=0;i<cap;i++)el.children[i].classList.toggle("gone",i>=keep);
  };
  put("w-top","h");put("w-bottom","h");put("w-left","v");put("w-right","v");
}

// keep the whole table inside the window, whatever the view or window size
let _fitBusy=false;
function boardBox(){
  const bd=$("board");
  const r=bd.getBoundingClientRect();
  let x1=r.left,y1=r.top,x2=r.right,y2=r.bottom;
  for(const el of bd.querySelectorAll(".seat,#center,.wall")){
    const q=el.getBoundingClientRect();
    if(!q.width&&!q.height)continue;
    if(q.left<x1)x1=q.left;
    if(q.top<y1)y1=q.top;
    if(q.right>x2)x2=q.right;
    if(q.bottom>y2)y2=q.bottom;
  }
  return {w:x2-x1,h:y2-y1};
}
function fitBoard(animate){
  const wrap=$("boardwrap"), bd=$("board");
  if(!wrap||!bd||_fitBusy)return;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  if(W<40||H<40)return;
  _fitBusy=true;
  const prev=bd.style.transition;
  if(!animate)bd.style.transition="none";
  const h0=Math.min(H,W/1.22);
  bd.style.height=h0+"px"; bd.style.width=(h0*1.22)+"px";
  for(let i=0;i<3;i++){
    const b=boardBox();
    if(!b.w||!b.h)break;
    const ratio=Math.min(W/b.w,H/b.h);
    if(ratio>0.995&&ratio<1.035)break;
    const cur=parseFloat(bd.style.getPropertyValue("--bs"))||1;
    bd.style.setProperty("--bs",Math.max(0.25,cur*ratio*0.985).toFixed(4));
  }
  requestAnimationFrame(()=>{if(!animate)bd.style.transition=prev;_fitBusy=false;});
}
window.addEventListener("resize",()=>fitBoard());
// at most one fit per frame, however often render() runs
let _fitQueued=false;
function queueFit(){
  if(_fitQueued)return;
  _fitQueued=true;
  requestAnimationFrame(()=>{_fitQueued=false;fitBoard();});
}

  }

  // discards
  const zones=["d-bottom","d-right","d-top","d-left"];

    });
  }
  queueFit();

function status(msg){$("status").textContent=msg;}

const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= human input ================= */

function clearButtons(){$("actions").innerHTML="";humanResolve=null;markHand(null);}
// light up the tiles in your own hand that a claim would use up
function markHand(list){

let discardResolve=null;
function onTileClick(idx){

    r({action:"discard",idx});
  }

/* ================= AI ================= */
function aiChooseDiscard(p){
  const P=G.players[p];
  const m=P.melds.length;
  let bestIdx=0,bestScore=Infinity;
  for(let i=0;i<P.hand.length;i++){
    const rest=P.hand.slice();rest.splice(i,1);
    const st=shanten(countsOf(rest),m);
    const t=P.hand[i];
    // tie-break: prefer throwing isolated honors/terminals
    let pen=0;
    if(isHonor(t)){
      const same=P.hand.filter(x=>x===t).length;
      pen=same>=2?3:-2;
    }else{
      const n=numOf(t);
      const near=P.hand.some(x=>x!==t&&suitOf(x)===suitOf(t)&&Math.abs(numOf(x)-numOf(t))<=2);
      pen=(near?2:-1)+((n===0||n===8)?-0.5:0);
    }
    const score=st*10+pen;
    if(score<bestScore){bestScore=score;bestIdx=i;}
  }
  return bestIdx;
}
function aiWantsPung(p,tile){
  const P=G.players[p];
  const c=countsOf(P.hand);
  if(c[tile]<2)return false;
  const before=shanten(c,P.melds.length);
  const after=P.hand.slice();
  let removed=0;
  for(let i=after.length-1;i>=0&&removed<2;i--)if(after[i]===tile){after.splice(i,1);removed++;}
  const st=shanten(countsOf(after),P.melds.length+1);
  return st<before;
}
function aiWantsKongDiscard(p,tile){
  const P=G.players[p];
  return countsOf(P.hand)[tile]===3;
}
function aiWantsChow(p,tile){
  const P=G.players[p];
  const opts=chowOptions(P.hand,tile);
  if(!opts.length)return null;
  const before=shanten(countsOf(P.hand),P.melds.length);
  let best=null,bestSt=before;
  for(const o of opts){
    const rest=P.hand.slice();
    for(const t of o.remove){rest.splice(rest.indexOf(t),1);}
    const st=shanten(countsOf(rest),P.melds.length+1);
    if(st<bestSt){bestSt=st;best=o;}
  }
  return best;
}
function chowOptions(hand,tile){
  if(tile>=27)return[];
  const s=suitOf(tile),n=numOf(tile),base=s*9;
  const has=x=>x>=0&&x<=8&&hand.includes(base+x);
  const opts=[];
  if(has(n-2)&&has(n-1))opts.push({tiles:[base+n-2,base+n-1,tile],remove:[base+n-2,base+n-1]});
  if(has(n-1)&&has(n+1))opts.push({tiles:[base+n-1,tile,base+n+1],remove:[base+n-1,base+n+1]});
  if(has(n+1)&&has(n+2))opts.push({tiles:[tile,base+n+1,base+n+2],remove:[base+n+1,base+n+2]});
  return opts;
}
/* ================= win checks ================= */
function winFan(p,winTile,selfDraw,ctx){
  const P=G.players[p];
  if(selfDraw){const last=P.hand.pop();const r=calcFan(G,p,last,true,ctx);P.hand.push(last);return r.fan;}
  return calcFan(G,p,winTile,false,ctx).fan;
}
function shapeWinsOn(p,tile){
  const P=G.players[p];
  const c=countsOf(P.hand);c[tile]++;
  return canWin(c,P.melds.length);
}
function playerCanWinOn(p,tile,ctx){
  return shapeWinsOn(p,tile)&&winFan(p,tile,false,ctx)>=MIN_FAN;
}

/* ================= flow ================= */
async function startHand(){
  buildWall();newPlayers();
  G.lastDiscard=null;G.drawnIdx=-1;G.canDiscard=false;G.started=true;G.busy=true;
  G.anyClaim=false;G.discardsMade=0;G.drawInfo=null;
  clearButtons();
  for(let r=0;r<13;r++)for(let k=0;k<4;k++){
    const p=(G.dealer+k)%4;
    G.players[p].hand.push(drawFront());
  }
  for(let k=0;k<4;k++){
    const p=(G.dealer+k)%4,P=G.players[p];
    for(let i=P.hand.length-1;i>=0;i--){
      if(isFlower(P.hand[i])){P.flowers.push(P.hand[i]);P.hand.splice(i,1);}
    }
    while(P.hand.length<13){
      let t=drawBack();
      while(t!==null&&isFlower(t)){P.flowers.push(t);t=drawBack();}
      if(t===null)break;
      P.hand.push(t);
    }
    sortHand(p);
  }
  G.cur=G.dealer;
  render();
  status(T("dealerline",G.handNum,NAMES[G.dealer]));
  await wait(900);
  gameTurn(false);
}

async function gameTurn(skipDraw){
  const p=G.cur,P=G.players[p];
  render();
  if(!skipDraw){
    status(T("draws",NAMES[p]));
    await wait(p===0?350:650);
    const t=drawFor(p,false);
    if(t===null)return endDrawnGame();
    P.hand.push(t);
    if(p===0){G.drawnIdx=P.hand.length-1;sortMyHand();}
    click(1500);
    render();
  }else{
    G.drawInfo=null;G.drawnIdx=-1;render();
  }
  if(p===0)await humanTurn(skipDraw);
  else await aiTurn(p);
}

async function humanTurn(afterClaim){
  const P=G.players[0];
  while(true){
    sortMyHand();render();
    const c=countsOf(P.hand);
    const opts=[];let note=null;
    if(!afterClaim&&canWin(c,P.melds.length)&&P.hand.length===14-3*P.melds.length){
      const wf=winFan(0,null,true,{});
      if(wf>=MIN_FAN)opts.push({label:T("bWin"),sub:T("bWinSub",wf),value:{action:"tsumo"}});
      else note=T("notenough",wf,MIN_FAN);
    }
    if(!afterClaim)for(let t=0;t<34;t++)if(c[t]===4)
      opts.push({label:T("bCkong"),sub:T("bCkongSub"),tiles:[t,t,t,t],use:[t,t,t,t],value:{action:"ckong",tile:t}});
    if(!afterClaim)for(const m of P.melds)if(m.type==="pung"&&P.hand.includes(m.tiles[0]))
      opts.push({label:T("bAkong"),sub:T("bAkongSub"),tiles:[m.tiles[0],m.tiles[0],m.tiles[0],m.tiles[0]],use:[m.tiles[0]],value:{action:"akong",tile:m.tiles[0],meld:m}});

    status(note||T("yourturn"));
    G.canDiscard=true;render();
    const act=await new Promise(res=>{
      discardResolve=res;
      if(opts.length){
        askButtons(opts).then(v=>{if(discardResolve){discardResolve=null;G.canDiscard=false;res(v);}});
      }
    });
    clearButtons();

    if(act.action==="tsumo"){return endWin(0,null,true,null,{});}
    if(act.action==="ckong"){
      for(let i=P.hand.length-1;i>=0;i--)if(P.hand[i]===act.tile)P.hand.splice(i,1);
      P.melds.push({type:"ckong",tiles:[act.tile,act.tile,act.tile,act.tile],from:null});
      G.anyClaim=true;click(900);
      const r=drawFor(0,true);
      if(r===null)return endDrawnGame();
      P.hand.push(r);G.drawnIdx=P.hand.length-1;afterClaim=false;continue;
    }
    if(act.action==="akong"){
      if(await tryRobKong(0,act.tile))return;
      P.hand.splice(P.hand.indexOf(act.tile),1);
      act.meld.type="kong";act.meld.tiles.push(act.tile);
      G.anyClaim=true;click(900);
      const r=drawFor(0,true);
      if(r===null)return endDrawnGame();
      P.hand.push(r);G.drawnIdx=P.hand.length-1;afterClaim=false;continue;
    }
    const t=P.hand.splice(act.idx,1)[0];
    return doDiscard(0,t);
  }
}

async function aiTurn(p){
  const P=G.players[p];
  await wait(350);
  const c=countsOf(P.hand);
  const fullSize=14-3*P.melds.length;
  if(P.hand.length===fullSize&&canWin(c,P.melds.length)&&winFan(p,null,true,{})>=MIN_FAN){
    return endWin(p,null,true,null,{});
  }
  for(let t=0;t<34;t++)if(c[t]===4){
    for(let i=P.hand.length-1;i>=0;i--)if(P.hand[i]===t)P.hand.splice(i,1);
    P.melds.push({type:"ckong",tiles:[t,t,t,t],from:null});
    G.anyClaim=true;
    status(T("ckongmsg",NAMES[p]));click(900);render();
    await wait(600);
    const r=drawFor(p,true);
    if(r===null)return endDrawnGame();
    P.hand.push(r);
    return aiTurn(p);
  }
  for(const m of P.melds)if(m.type==="pung"&&P.hand.includes(m.tiles[0])){
    const kt=m.tiles[0];
    status(T("akongmsg",NAMES[p],tileName(kt)));click(900);render();
    await wait(600);
    if(await tryRobKong(p,kt))return;
    P.hand.splice(P.hand.indexOf(kt),1);
    m.type="kong";m.tiles.push(kt);
    G.anyClaim=true;render();
    const r=drawFor(p,true);
    if(r===null)return endDrawnGame();
    P.hand.push(r);
    return aiTurn(p);
  }
  const idx=aiChooseDiscard(p);
  const t=P.hand.splice(idx,1)[0];
  sortHand(p);
  return doDiscard(p,t);
}

// 搶槓: anyone may win on a tile used to add to an exposed pung
async function tryRobKong(k,tile){
  for(let i=1;i<=3;i++){
    const q=(k+i)%4;
    const ctx={robKong:true,discarder:k};
    if(!playerCanWinOn(q,tile,ctx))continue;
    if(q===0){
      status(T("canrob",tileName(tile)));
      const v=await askButtons([
        {label:T("bHu"),sub:T("bRobSub"),tiles:[tile],claim:tile,value:"win"},
        {label:T("bPass"),value:"pass",pass:true}
      ]);
      if(v==="win"){await endWin(0,tile,false,k,ctx);return true;}
    }else{
      await endWin(q,tile,false,k,ctx);return true;
    }
  }
  return false;
}

async function doDiscard(p,tile){
  G.players[p].discards.push(tile);
  G.discardsMade++;
  G.lastDiscard={player:p,tile,live:true};
  G.drawnIdx=-1;G.canDiscard=false;G.drawInfo=null;
  click(1200);
  status(T("discards",NAMES[p],tileName(tile)));
  render();
  await wait(450);
  if(p!==0&&shapeWinsOn(0,tile)&&!playerCanWinOn(0,tile,{discarder:p})){
    const wf=winFan(0,tile,false,{discarder:p});
    status(T("completesbut",tileName(tile),wf,MIN_FAN));
    await wait(1600);
  }
  const claim=await resolveClaims(p,tile);
  if(claim===undefined)return;
  if(claim){
    G.players[p].discards.pop();
    G.lastDiscard=null;G.anyClaim=true;
    const q=claim.player,Q=G.players[q];
    if(claim.type==="pung"){
      let rm=0;
      for(let i=Q.hand.length-1;i>=0&&rm<2;i--)if(Q.hand[i]===tile){Q.hand.splice(i,1);rm++;}
      Q.melds.push({type:"pung",tiles:[tile,tile,tile],from:p});
      status(T("pungmsg",NAMES[q]));click(800);
      G.cur=q;render();await wait(600);
      return gameTurn(true);
    }
    if(claim.type==="kong"){
      let rm=0;
      for(let i=Q.hand.length-1;i>=0&&rm<3;i--)if(Q.hand[i]===tile){Q.hand.splice(i,1);rm++;}
      Q.melds.push({type:"kong",tiles:[tile,tile,tile,tile],from:p});
      status(T("kongmsg",NAMES[q]));click(800);
      G.cur=q;render();await wait(600);
      const r=drawFor(q,true);
      if(r===null)return endDrawnGame();
      Q.hand.push(r);if(q===0){G.drawnIdx=Q.hand.length-1;sortMyHand();}
      if(q===0)return humanTurn(false);
      return aiTurn(q);
    }
    if(claim.type==="chow"){
      for(const t of claim.opt.remove)Q.hand.splice(Q.hand.indexOf(t),1);
      Q.melds.push({type:"chow",tiles:claim.opt.tiles.slice(),from:p});
      status(T("chowmsg",NAMES[q]));click(800);
      G.cur=q;render();await wait(600);
      return gameTurn(true);
    }
  }
  if(G.lastDiscard)G.lastDiscard.live=false;
  G.cur=(p+1)%4;
  return gameTurn(false);
}

// {player,type,opt?} | null | undefined (undefined = hand already ended)
async function resolveClaims(discarder,tile){
  G.humanPassed=false;
  for(let k=1;k<=3;k++){
    const q=(discarder+k)%4;
    const ctx={discarder};
    if(!playerCanWinOn(q,tile,ctx))continue;
    if(q===0){
      const wf=winFan(0,tile,false,ctx);
      status(T("canwin",tileName(tile)));
      const v=await askButtons([
        {label:T("bHu"),sub:T("bHuSub",wf),tiles:[tile],claim:tile,value:"win"},
        {label:T("bPass"),value:"pass",pass:true}
      ]);
      if(v==="win"){await endWin(0,tile,false,discarder,ctx);return undefined;}
    }else{
      await endWin(q,tile,false,discarder,ctx);return undefined;
    }
  }
  for(let k=1;k<=3;k++){
    const q=(discarder+k)%4,Q=G.players[q];
    const c=countsOf(Q.hand);
    if(c[tile]<2)continue;
    if(q===0){
      const opts=[{label:T("bPung"),tiles:[tile,tile,tile],claim:tile,use:[tile,tile],value:"pung"}];
      if(c[tile]>=3)opts.push({label:T("bKong"),tiles:[tile,tile,tile,tile],claim:tile,use:[tile,tile,tile],value:"kong"});
      if((discarder+1)%4===0){
        for(const o of chowOptions(Q.hand,tile))opts.push({label:T("bChow"),tiles:o.tiles.slice(),claim:tile,use:o.remove.slice(),value:{chow:o}});
      }
      opts.push({label:T("bPass"),value:"pass",pass:true});
      status(T("claimq",NAMES[discarder],tileName(tile)));
      const v=await askButtons(opts);
      if(v==="pung")return{player:0,type:"pung"};
      if(v==="kong")return{player:0,type:"kong"};
      if(v&&v.chow)return{player:0,type:"chow",opt:v.chow};
      G.humanPassed=true;
    }else{
      if(c[tile]===3&&aiWantsKongDiscard(q,tile)&&aiWantsPung(q,tile))return{player:q,type:"kong"};
      if(aiWantsPung(q,tile))return{player:q,type:"pung"};
    }
  }
  const nq=(discarder+1)%4,NQ=G.players[nq];
  if(nq===0){
    if(!G.humanPassed&&countsOf(NQ.hand)[tile]<2){
      const opts=chowOptions(NQ.hand,tile);
      if(opts.length){
        const btns=opts.map(o=>({label:T("bChow"),tiles:o.tiles.slice(),claim:tile,use:o.remove.slice(),value:{chow:o}}));
        btns.push({label:T("bPass"),value:"pass",pass:true});
        status(T("chowq",NAMES[discarder],tileName(tile)));
        const v=await askButtons(btns);
        if(v&&v.chow){G.humanPassed=false;return{player:0,type:"chow",opt:v.chow};}
      }
    }
  }else{
    const o=aiWantsChow(nq,tile);
    if(o){G.humanPassed=false;return{player:nq,type:"chow",opt:o};}
  }
  G.humanPassed=false;
  return null;
}

/* ================= hand end ================= */
function scoreTable(delta){
  let html='<h3>'+T("pointshead")+'</h3><table><tr><th>'+T("colplayer")+'</th><th>'+T("colthis")+'</th><th>'+T("coltotal")+'</th></tr>';
  for(let i=0;i<4;i++){
    const d=delta[i];
    html+='<tr><td>'+NAMES[i]+'</td><td class="'+(d>0?"pos":d<0?"neg":"")+'">'+(d>0?"+":"")+d+'</td><td>'+G.scores[i]+'</td></tr>';
  }
  return html+'</table>';
}

async function endWin(p,winTile,selfDraw,discarder,ctx){
  G.started=false;clearButtons();
  ctx=Object.assign({discarder},ctx||{});
  const P=G.players[p];
  let result;
  if(selfDraw){
    const last=P.hand.pop();
    result=calcFan(G,p,last,true,ctx);
    P.hand.push(last);
  }else{
    result=calcFan(G,p,winTile,false,ctx);
  }
  const pts=result.fan;
  const delta=[0,0,0,0];
  if(selfDraw){
    for(let i=0;i<4;i++)if(i!==p){delta[i]-=pts;delta[p]+=pts;}
  }else{
    delta[discarder]-=pts;delta[p]+=pts;
  }
  for(let i=0;i<4;i++)G.scores[i]+=delta[i];
  render();
  click(600);await wait(200);click(500);

  const full=P.hand.slice();
  if(!selfDraw)full.push(winTile);
  full.sort((a,b)=>a-b);
  let how;
  if(selfDraw)how=T("bySelfDraw");
  else if(ctx.robKong)how=T("byRob",NAMES[discarder],tileName(winTile));
  else how=T("byDiscard",NAMES[discarder],tileName(winTile));
  let html='<h2>'+(p===0?T("youwin"):T("somewin",NAMES[p]))+'</h2>';
  html+='<p>'+how+'</p>';
  html+='<div class="tilespread" id="ov-tiles"></div>';
  html+='<h3>'+T("faanhead")+'</h3>';
  for(const f of result.fans)html+='<div class="fanline"><span>'+f[0]+'</span><span>'+T("faanunit",f[1])+'</span></div>';
  html+='<div class="total"><span>'+T("total")+'</span><span>'+T("faanunit",pts)+'</span></div>';
  html+='<p class="small">'+(selfDraw?T("selfdrawpay",pts):T("discardpay",NAMES[discarder],pts))+'</p>';
  html+=scoreTable(delta);
  html+='<div class="btnrow"><button class="btn" id="ov-next">'+T("nexthand")+'</button></div>';
  showPanel(html);
  const spread=$("ov-tiles");
  for(const m of P.melds){
    const box=document.createElement("div");box.className="meld";
    for(const t of m.tiles)box.appendChild(tileEl(t,"t-md"));
    spread.appendChild(box);
  }
  const box=document.createElement("div");box.className="meld";
  for(const t of full)box.appendChild(tileEl(t,"t-md"));
  spread.appendChild(box);
  if(P.flowers.length){
    const fb=document.createElement("div");fb.className="meld";
    for(const t of P.flowers)fb.appendChild(tileEl(t,"t-sm"));
    spread.appendChild(fb);
  }
  $("ov-next").addEventListener("click",()=>{hidePanel();nextHand(p);});
}

function endDrawnGame(){
  G.started=false;clearButtons();
  let html='<h2>'+T("drawnhead")+'</h2><p>'+T("drawnbody")+'</p>';
  html+='<div class="btnrow"><button class="btn" id="ov-next">'+T("nexthand")+'</button></div>';
  showPanel(html);
  $("ov-next").addEventListener("click",()=>{hidePanel();nextHand(null);});
}

function nextHand(winner){
  G.handNum++;
  if(winner===null||winner===G.dealer){
    // dealer keeps the seat
  }else{
    const nd=(G.dealer+1)%4;
    if(nd===0&&G.dealer===3)G.prevailing=(G.prevailing+1)%4;
    G.dealer=nd;
  }
  startHand();
}
